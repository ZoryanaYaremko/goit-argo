apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx
  namespace: infra-tools

spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: nginx
    targetRevision: 21.1.23

    helm:
      values: |
        service:
          type: ClusterIP

        replicaCount: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: application

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true